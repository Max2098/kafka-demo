spring:
  application:
    name: kafka-producer-demo
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/postgres
    username: postgres
    password: postgres
  liquibase:
    default-schema: kafka
    liquibase-schema: public
    parameters:
      default-schema-prefix: kafka.
    database-change-log-table: kafka_log
    database-change-log-lock-table: kafka_lock
    enabled: true
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: kafka
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      compression-type: zstd
      transaction-id-prefix: tx-${spring.application.name}-
      properties:
        enable:
          idempotence: true
        spring:
          json:
            add:
              type:
                headers: false

logging:
  level:
    root: INFO
    org.demo: DEBUG

demo:
  kafka:
    scheduler:
      send:
        enabled: true
        fixed-rate: 30000
      save:
        enabled: true
        fixed-rate: 10000
    topics:
      user-topic: user-topic
      replicas: 3
      partitions: 2
